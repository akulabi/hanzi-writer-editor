<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimCJK Direct SVG Fetcher & Hanzi Writer Converter</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;500;600;700&family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-mono { font-family: 'Fira Code', monospace; }
        .font-hanzi { font-family: 'Noto Serif TC', serif; }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col antialiased">

    <!-- Header -->
    <header class="border-b border-slate-200 bg-white sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 h-14 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <div class="p-1.5 bg-indigo-50 text-indigo-600 rounded-md border border-indigo-100">
                    <i data-lucide="convert-shape" class="w-5 h-5"></i>
                </div>
                <h1 class="font-bold text-base text-slate-900">AnimCJK <span class="text-indigo-600">→</span> Hanzi Writer</h1>
            </div>
            <div id="fetchStatusText" class="text-xs text-emerald-600 font-medium flex items-center">
                <i data-lucide="check" class="w-3.5 h-3.5 mr-1"></i> Ready
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-6xl w-full mx-auto px-4 py-5 grid grid-cols-1 lg:grid-cols-12 gap-5">

        <!-- Left Column: Controls & Input (5 Cols) -->
        <section class="lg:col-span-5 flex flex-col space-y-4">
            
            <!-- Character Input Card -->
            <div class="bg-white border border-slate-200 rounded-lg p-4 shadow-sm space-y-4">
                
                <div>
                    <div class="relative">
                        <input type="text" id="characterInput" value="永" placeholder="Character e.g. 永" 
                            class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-base font-hanzi text-slate-900 placeholder-slate-400 focus:outline-none focus:border-indigo-500 focus:bg-white pr-10 transition">
                        <button onclick="fetchCharacterData()" class="absolute right-1.5 top-1.5 bottom-1.5 px-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-md text-xs font-semibold transition flex items-center">
                            <i data-lucide="search" class="w-3.5 h-3.5"></i>
                        </button>
                    </div>
                </div>

                <!-- Multi-character Selection Tabs -->
                <div id="charTabContainer" class="hidden space-y-1">
                    <div id="charTabList" class="flex flex-wrap gap-1 p-1 bg-slate-50 border border-slate-200 rounded-md">
                        <!-- Dynamic character pills -->
                    </div>
                </div>

                <!-- Repository Selection -->
                <div class="grid grid-cols-2 gap-1.5">
                    <button onclick="setDictionaryRepo('svgsZhHant')" id="repo-svgsZhHant" class="repo-btn py-1.5 px-2.5 rounded-md text-xs font-medium border transition flex items-center justify-between bg-indigo-600 border-indigo-600 text-white">
                        <span>ZhHant (Traditional)</span>
                        <i data-lucide="check" class="w-3.5 h-3.5"></i>
                    </button>
                    <button onclick="setDictionaryRepo('svgsZhHans')" id="repo-svgsZhHans" class="repo-btn py-1.5 px-2.5 rounded-md text-xs font-medium border transition flex items-center justify-between bg-white border-slate-200 text-slate-600 hover:bg-slate-50">
                        <span>ZhHans (Simplified)</span>
                        <i data-lucide="check" class="w-3.5 h-3.5 opacity-0"></i>
                    </button>
                    <button onclick="setDictionaryRepo('svgsJa')" id="repo-svgsJa" class="repo-btn py-1.5 px-2.5 rounded-md text-xs font-medium border transition flex items-center justify-between bg-white border-slate-200 text-slate-600 hover:bg-slate-50">
                        <span>Ja (Kanji)</span>
                        <i data-lucide="check" class="w-3.5 h-3.5 opacity-0"></i>
                    </button>
                    <button onclick="setDictionaryRepo('svgsKo')" id="repo-svgsKo" class="repo-btn py-1.5 px-2.5 rounded-md text-xs font-medium border transition flex items-center justify-between bg-white border-slate-200 text-slate-600 hover:bg-slate-50">
                        <span>Ko (Hanja)</span>
                        <i data-lucide="check" class="w-3.5 h-3.5 opacity-0"></i>
                    </button>
                </div>

                <!-- Active Info Card -->
                <div class="bg-slate-50 border border-slate-200 rounded-lg p-3 flex items-center justify-between">
                    <div class="flex items-center space-x-3">
                        <div id="activeCharDisplay" class="w-10 h-10 bg-white border border-slate-200 rounded-md flex items-center justify-center text-xl font-bold font-hanzi text-indigo-600 shadow-sm">
                            永
                        </div>
                        <div class="space-y-0.5">
                            <div class="flex items-center space-x-1.5">
                                <span id="activeCharUnicode" class="font-mono text-xs font-medium text-slate-700">U+6C38</span>
                                <span id="activeDecCode" class="font-mono text-[10px] bg-slate-200 text-slate-700 px-1.5 py-0.2 rounded">Dec: 27704</span>
                            </div>
                            <div class="text-[11px] text-slate-400 font-mono truncate max-w-[170px]">
                                <a id="svgSourceLink" href="#" target="_blank" class="hover:text-indigo-600">animCJK</a>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Quick Samples -->
                <div class="flex items-center space-x-1.5">
                    <span class="text-xs text-slate-400 font-medium">Presets:</span>
                    <div class="flex gap-1 flex-1">
                        <button onclick="loadPreset('永')" class="px-2 py-1 bg-slate-100 hover:bg-slate-200 border border-slate-200 text-slate-700 rounded text-xs font-hanzi font-bold transition">永</button>
                        <button onclick="loadPreset('福')" class="px-2 py-1 bg-slate-100 hover:bg-slate-200 border border-slate-200 text-slate-700 rounded text-xs font-hanzi font-bold transition">福</button>
                        <button onclick="loadPreset('繁')" class="px-2 py-1 bg-slate-100 hover:bg-slate-200 border border-slate-200 text-slate-700 rounded text-xs font-hanzi font-bold transition">繁</button>
                        <button onclick="loadPreset('龍')" class="px-2 py-1 bg-slate-100 hover:bg-slate-200 border border-slate-200 text-slate-700 rounded text-xs font-hanzi font-bold transition">龍</button>
                        <button onclick="loadPreset('愛')" class="px-2 py-1 bg-slate-100 hover:bg-slate-200 border border-slate-200 text-slate-700 rounded text-xs font-hanzi font-bold transition">愛</button>
                    </div>
                </div>

            </div>

        </section>

        <!-- Right Column: Visualizer & Output (7 Cols) -->
        <section class="lg:col-span-7 flex flex-col space-y-4">

            <!-- Visualizer Card -->
            <div class="bg-white border border-slate-200 rounded-lg overflow-hidden shadow-sm flex flex-col">
                <div class="border-b border-slate-100 px-4 py-2.5 flex items-center justify-between">
                    <h2 class="text-xs font-semibold text-slate-700 uppercase tracking-wider">Visualizer</h2>
                    <span id="strokeCountBadge" class="text-xs font-mono bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded font-medium border border-indigo-100">
                        0 Strokes
                    </span>
                </div>

                <div class="p-4 flex flex-col sm:flex-row items-center gap-4">
                    <!-- SVG Box -->
                    <div class="w-48 h-48 bg-slate-50 border border-slate-200 rounded-lg flex items-center justify-center relative flex-shrink-0">
                        <div class="absolute inset-0 grid grid-cols-2 grid-rows-2 pointer-events-none opacity-20 border border-slate-300">
                            <div class="border-r border-b border-slate-400"></div>
                            <div class="border-b border-slate-400"></div>
                            <div class="border-r border-slate-400"></div>
                            <div></div>
                        </div>
                        
                        <div id="svgContainer" class="w-full h-full flex items-center justify-center z-10 p-2">
                            <div id="loadingSpinner" class="flex flex-col items-center space-y-1 text-indigo-600">
                                <i data-lucide="loader-2" class="w-6 h-6 animate-spin"></i>
                            </div>
                        </div>
                    </div>

                    <!-- Step Controls -->
                    <div class="flex-1 w-full space-y-3">
                        <div>
                            <div class="flex justify-between text-xs font-medium text-slate-500 mb-1">
                                <span>Progress</span>
                                <span id="strokeStepLabel" class="text-indigo-600 font-mono font-medium">0 / 0</span>
                            </div>
                            <input type="range" id="strokeSlider" min="0" max="0" value="0" class="w-full accent-indigo-600 bg-slate-200 h-1.5 rounded-lg appearance-none cursor-pointer">
                        </div>

                        <div class="flex items-center space-x-1.5 pt-1">
                            <button id="prevBtn" onclick="stepStroke(-1)" class="p-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-md text-xs font-medium transition">
                                <i data-lucide="chevron-left" class="w-4 h-4"></i>
                            </button>
                            <button id="playBtn" onclick="togglePlayAnimation()" class="flex-1 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-md text-xs font-semibold transition flex items-center justify-center space-x-1">
                                <i id="playIcon" data-lucide="play" class="w-3.5 h-3.5"></i>
                                <span id="playText">Animate</span>
                            </button>
                            <button id="nextBtn" onclick="stepStroke(1)" class="p-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-md text-xs font-medium transition">
                                <i data-lucide="chevron-right" class="w-4 h-4"></i>
                            </button>
                            <button onclick="resetStrokeHighlight()" class="p-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-md text-xs font-medium transition">
                                <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- JSON Output Card -->
            <div class="bg-white border border-slate-200 rounded-lg overflow-hidden shadow-sm flex flex-col flex-1">
                <div class="border-b border-slate-100 px-4 py-2.5 flex items-center justify-between">
                    <h2 class="text-xs font-semibold text-slate-700 uppercase tracking-wider">Hanzi Writer JSON</h2>
                    <div class="flex items-center space-x-1.5">
                        <button onclick="copyToClipboard()" class="px-2.5 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-md text-xs font-medium transition flex items-center space-x-1">
                            <i data-lucide="copy" class="w-3 h-3"></i>
                            <span>Copy</span>
                        </button>
                        <button onclick="downloadJson()" class="px-2.5 py-1 bg-indigo-600 hover:bg-indigo-700 text-white rounded-md text-xs font-semibold transition flex items-center space-x-1">
                            <i data-lucide="download" class="w-3 h-3"></i>
                            <span>Download</span>
                        </button>
                    </div>
                </div>

                <div class="p-3 bg-slate-900 flex-1 relative">
                    <textarea id="jsonOutput" readonly class="w-full h-44 bg-transparent font-mono text-xs text-indigo-300 focus:outline-none resize-none selection:bg-indigo-950" placeholder="// JSON output..."></textarea>
                    
                    <div id="toast" class="absolute bottom-3 right-3 bg-slate-800 text-white text-xs px-2.5 py-1.5 rounded shadow-lg flex items-center space-x-1.5 opacity-0 pointer-events-none transition-all duration-200">
                        <i data-lucide="check" class="w-3.5 h-3.5 text-emerald-400"></i>
                        <span id="toastMessage">Copied</span>
                    </div>
                </div>
            </div>

        </section>

    </main>

    <!-- JS Application Logic -->
    <script>
        // State variables
        let selectedRepo = 'svgsZhHant';
        let activeChar = '永';
        let parsedCharacters = ['永'];
        let strokePaths = [];
        let isPlaying = false;
        let animationInterval = null;

        document.addEventListener("DOMContentLoaded", () => {
            lucide.createIcons();
            setupListeners();
            fetchCharacterData();
        });

        function setupListeners() {
            const input = document.getElementById('characterInput');
            const slider = document.getElementById('strokeSlider');

            input.addEventListener('input', (e) => {
                const val = Array.from(e.target.value.trim());
                if (val.length > 0) {
                    parsedCharacters = val;
                    updateCharTabs();
                    activeChar = parsedCharacters[0];
                    fetchCharacterData();
                }
            });

            slider.addEventListener('input', (e) => {
                stopAnimation();
                highlightStroke(parseInt(e.target.value));
            });
        }

        function setDictionaryRepo(repoName) {
            selectedRepo = repoName;
            
            document.querySelectorAll('.repo-btn').forEach(btn => {
                btn.className = "repo-btn py-1.5 px-2.5 rounded-md text-xs font-medium border transition flex items-center justify-between bg-white border-slate-200 text-slate-600 hover:bg-slate-50";
                const icon = btn.querySelector('i');
                if (icon) {
                    icon.classList.add('opacity-0');
                }
            });

            const activeBtn = document.getElementById(`repo-${repoName}`);
            if (activeBtn) {
                activeBtn.className = "repo-btn py-1.5 px-2.5 rounded-md text-xs font-medium border transition flex items-center justify-between bg-indigo-600 border-indigo-600 text-white";
                const icon = activeBtn.querySelector('i');
                if (icon) {
                    icon.classList.remove('opacity-0');
                }
            }
            fetchCharacterData();
        }

        function updateCharTabs() {
            const container = document.getElementById('charTabContainer');
            const list = document.getElementById('charTabList');
            
            if (parsedCharacters.length <= 1) {
                container.classList.add('hidden');
                return;
            }

            container.classList.remove('hidden');
            list.innerHTML = '';

            parsedCharacters.forEach((char) => {
                const btn = document.createElement('button');
                const isSelected = char === activeChar;
                btn.className = `px-2 py-0.5 rounded text-xs font-bold transition font-hanzi ${
                    isSelected 
                    ? 'bg-indigo-600 text-white' 
                    : 'bg-white text-slate-600 hover:bg-slate-100'
                }`;
                btn.textContent = char;
                btn.onclick = () => {
                    activeChar = char;
                    updateCharTabs();
                    fetchCharacterData();
                };
                list.appendChild(btn);
            });
        }

        function loadPreset(char) {
            document.getElementById('characterInput').value = char;
            parsedCharacters = [char];
            activeChar = char;
            updateCharTabs();
            fetchCharacterData();
        }

        function getUnicodeDec(char) {
            if (!char) return "27704";
            return char.codePointAt(0).toString(10);
        }

        function getUnicodeHex(char) {
            if (!char) return "6C38";
            return char.codePointAt(0).toString(16).toUpperCase();
        }

        async function fetchCharacterData() {
            stopAnimation();

            const charDisplay = document.getElementById('activeCharDisplay');
            const unicodeText = document.getElementById('activeCharUnicode');
            const decCodeText = document.getElementById('activeDecCode');
            const statusText = document.getElementById('fetchStatusText');
            const svgContainer = document.getElementById('svgContainer');
            const svgSourceLink = document.getElementById('svgSourceLink');

            charDisplay.textContent = activeChar || "永";
            const decCode = getUnicodeDec(activeChar);
            const hexCode = getUnicodeHex(activeChar);
            unicodeText.textContent = `U+${hexCode}`;
            decCodeText.textContent = `Dec: ${decCode}`;

            statusText.className = "text-xs text-amber-600 font-medium flex items-center";
            statusText.innerHTML = `<i data-lucide="loader-2" class="w-3.5 h-3.5 mr-1 animate-spin"></i> Fetching...`;
            svgContainer.innerHTML = `<div class="text-indigo-600"><i data-lucide="loader-2" class="w-6 h-6 animate-spin"></i></div>`;
            lucide.createIcons();

            const searchRepos = Array.from(new Set([selectedRepo, 'svgsZhHant', 'svgsZhHans', 'svgsJa', 'svgsKo']));
            let svgText = null;
            let foundRepo = "";

            for (const repo of searchRepos) {
                const targetUrl = `https://raw.githubusercontent.com/parsimonhi/animCJK/master/${repo}/${decCode}.svg`;
                try {
                    const response = await fetch(targetUrl);
                    if (response.ok) {
                        svgText = await response.text();
                        foundRepo = repo;
                        svgSourceLink.textContent = `${repo}/${decCode}.svg`;
                        svgSourceLink.href = targetUrl;
                        break;
                    }
                } catch (e) {}
            }

            if (svgText) {
                statusText.className = "text-xs text-emerald-600 font-medium flex items-center";
                statusText.innerHTML = `<i data-lucide="check" class="w-3.5 h-3.5 mr-1"></i> Loaded (${foundRepo})`;
                parseAndRenderSvg(svgText);
            } else {
                statusText.className = "text-xs text-rose-600 font-medium flex items-center";
                statusText.innerHTML = `<i data-lucide="alert-circle" class="w-3.5 h-3.5 mr-1"></i> Not Found`;

                svgContainer.innerHTML = `<div class="text-center p-2">
                    <i data-lucide="file-warning" class="w-6 h-6 text-rose-500 mx-auto mb-1"></i>
                    <p class="text-xs text-slate-500 font-medium">Not Found in AnimCJK</p>
                </div>`;
                
                strokePaths = [];
                document.getElementById('jsonOutput').value = "// Character SVG standard file was not found.";
                document.getElementById('strokeCountBadge').textContent = `0 Strokes`;
                lucide.createIcons();
            }
        }

        function parseAndRenderSvg(svgText) {
            const parser = new DOMParser();
            const svgDoc = parser.parseFromString(svgText, "image/svg+xml");
            
            const paths = svgDoc.querySelectorAll('path');
            strokePaths = [];

            paths.forEach(path => {
                const d = path.getAttribute('d');
                const id = path.getAttribute('id') || '';
                if (d && !id.includes('bg') && !id.includes('grid')) {
                    strokePaths.push(d);
                }
            });

            renderSvgInContainer(svgText);
            updateJsonOutput();
            setupSlider();
        }

        function renderSvgInContainer(svgText) {
            const container = document.getElementById('svgContainer');
            container.innerHTML = svgText;

            const svgElement = container.querySelector('svg');
            if (svgElement) {
                svgElement.setAttribute('width', '100%');
                svgElement.setAttribute('height', '100%');
                svgElement.classList.add('max-w-full', 'max-h-full');

                const paths = svgElement.querySelectorAll('path');
                paths.forEach((p, idx) => {
                    p.setAttribute('data-stroke-index', idx);
                    p.style.transition = 'all 0.2s ease';
                    p.style.fill = '#1e293b';
                    p.style.stroke = '#cbd5e1';
                    p.style.strokeWidth = '0.5';
                });
            }

            document.getElementById('strokeCountBadge').textContent = `${strokePaths.length} Strokes`;
        }

        function setupSlider() {
            const slider = document.getElementById('strokeSlider');
            slider.min = 0;
            slider.max = strokePaths.length;
            slider.value = strokePaths.length;
            updateSliderLabel(strokePaths.length);
        }

        function updateSliderLabel(val) {
            const label = document.getElementById('strokeStepLabel');
            label.textContent = `${val} / ${strokePaths.length}`;
        }

        function highlightStroke(step) {
            updateSliderLabel(step);
            const container = document.getElementById('svgContainer');
            const paths = container.querySelectorAll('path');

            paths.forEach((p, idx) => {
                if (step === strokePaths.length) {
                    p.style.opacity = '1';
                    p.style.fill = '#1e293b';
                } else if (idx < step) {
                    p.style.opacity = '0.85';
                    p.style.fill = '#64748b';
                } else if (idx === step - 1 && step > 0) {
                    p.style.opacity = '1';
                    p.style.fill = '#4f46e5';
                } else {
                    p.style.opacity = '0.12';
                    p.style.fill = '#94a3b8';
                }
            });
        }

        function stepStroke(delta) {
            stopAnimation();
            const slider = document.getElementById('strokeSlider');
            let current = parseInt(slider.value) + delta;
            if (current < 0) current = 0;
            if (current > strokePaths.length) current = strokePaths.length;
            slider.value = current;
            highlightStroke(current);
        }

        function resetStrokeHighlight() {
            stopAnimation();
            const slider = document.getElementById('strokeSlider');
            slider.value = strokePaths.length;
            highlightStroke(strokePaths.length);
        }

        function togglePlayAnimation() {
            if (isPlaying) {
                stopAnimation();
            } else {
                startAnimation();
            }
        }

        function startAnimation() {
            if (strokePaths.length === 0) return;
            isPlaying = true;

            const playIcon = document.getElementById('playIcon');
            const playText = document.getElementById('playText');
            playIcon.setAttribute('data-lucide', 'pause');
            playText.textContent = "Pause";
            lucide.createIcons();

            let currentStep = 0;
            const slider = document.getElementById('strokeSlider');

            animationInterval = setInterval(() => {
                currentStep = (currentStep % strokePaths.length) + 1;
                slider.value = currentStep;
                highlightStroke(currentStep);
            }, 500);
        }

        function stopAnimation() {
            isPlaying = false;
            if (animationInterval) clearInterval(animationInterval);
            const playIcon = document.getElementById('playIcon');
            const playText = document.getElementById('playText');
            playIcon.setAttribute('data-lucide', 'play');
            playText.textContent = "Animate";
            lucide.createIcons();
        }

        function updateJsonOutput() {
            const hanziWriterJson = {
                "character": activeChar || "?",
                "strokes": strokePaths,
                "medians": []
            };

            document.getElementById('jsonOutput').value = JSON.stringify(hanziWriterJson, null, 2);
        }

        function copyToClipboard() {
            const jsonText = document.getElementById('jsonOutput').value;
            if (!jsonText) return;

            const textArea = document.getElementById('jsonOutput');
            textArea.select();
            document.execCommand('copy');
            showToast("Copied to clipboard");
        }

        function downloadJson() {
            const jsonText = document.getElementById('jsonOutput').value;
            if (!jsonText) return;

            const filename = `${activeChar || 'character'}.json`;
            const blob = new Blob([jsonText], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            showToast(`Downloaded ${filename}`);
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMessage');
            toastMsg.textContent = msg;

            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');

            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2000);
        }
    </script>
</body>
</html>
